<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文舞集 課程預約</title>
  
  <!-- 引入 LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      /* 超絢麗霓虹漸層 */
      --primary-gradient: linear-gradient(135deg, #ff007f, #7928ca, #00dfd8);
      --animated-gradient: linear-gradient(90deg, #ff007f, #7928ca, #00dfd8, #ff007f);
      --primary-pink: #ff007f;
      --primary-purple: #7928ca;
      --border-color: #f0f0f0;
      --text-main: #1d1d1f;
      --text-sub: #6e6e73;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f4f5f9;
      margin: 0;
      padding: 24px 16px;
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
    }

    .form-container {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px 22px;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(121, 40, 202, 0.12);
      position: relative;
      overflow: hidden;
    }

    /* --- 1. 標題動態流光效果 --- */
    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h2 {
      text-align: center;
      margin: 0 0 8px 0;
      font-size: 1.7rem;
      font-weight: 900;
      background: var(--animated-gradient);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 4s ease infinite;
      letter-spacing: 1px;
    }

    .user-welcome {
      text-align: center;
      color: var(--text-sub);
      font-size: 0.92rem;
      margin-bottom: 26px;
      padding-bottom: 14px;
      border-bottom: 1px dashed #e5e5ea;
    }

    .section-title {
      font-weight: 700;
      margin-bottom: 16px;
      font-size: 1rem;
      display: block;
      color: var(--text-main);
    }

    /* 隱藏原生 Radio */
    .course-radio-input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .course-card-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }

    /* --- 2. 華麗彈跳登場動畫 (Spring Bounce Entry) --- */
    @keyframes springSlideUp {
      0% {
        opacity: 0;
        transform: translateY(35px) scale(0.92);
      }
      60% {
        opacity: 1;
        transform: translateY(-6px) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card-item-wrapper {
      opacity: 0;
      animation: springSlideUp 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* --- 3. 卡片基底與動態流光的容器 --- */
    .course-card {
      position: relative;
      background-color: #ffffff;
      border-radius: 18px;
      padding: 20px;
      cursor: pointer;
      box-sizing: border-box;
      border: 2px solid #eaeaea;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.28s ease, border-color 0.28s ease;
      display: block;
      overflow: hidden;
    }

    /* 按壓 Q 彈微互動 */
    .course-card:active {
      transform: scale(0.95) !important;
    }

    /* --- 4. 選中卡片：絢麗動態邊框 + 懸浮 + 光暈 --- */
    .course-radio-input:checked + .course-card {
      border-color: transparent;
      background-image: linear-gradient(#ffffff, #ffffff), var(--animated-gradient);
      background-size: 100% 100%, 200% 200%;
      background-origin: border-box;
      background-clip: padding-box, border-box;
      animation: gradientFlow 3s ease infinite;
      transform: translateY(-6px);
      box-shadow: 0 12px 28px rgba(255, 0, 127, 0.22);
    }

    /* 右上角勾勾圖示外圈 */
    .card-check-icon {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #ddd;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #fff;
      transition: all 0.3s ease;
    }

    /* --- 5. 勾勾 180度旋轉彈跳動畫 (Pop-Spin) --- */
    @keyframes popSpin {
      0% { transform: scale(0.3) rotate(-180deg); }
      70% { transform: scale(1.25) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .course-radio-input:checked + .course-card .card-check-icon {
      background: var(--primary-gradient);
      border-color: transparent;
      animation: popSpin 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .course-radio-input:checked + .course-card .card-check-icon::after {
      content: "✓";
      font-weight: 900;
    }

    /* 卡片內容視覺 */
    .course-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .course-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      padding-right: 30px;
      line-height: 1.35;
    }

    /* 華麗脈衝呼吸燈 HOT 標籤 */
    .hot-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 0, 127, 0.12);
      color: var(--primary-pink);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(255, 0, 127, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 6px rgba(255, 0, 127, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(255, 0, 127, 0);
      }
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: var(--primary-pink);
      border-radius: 50%;
      animation: pulseGlow 1.8s infinite ease-in-out;
    }

    .course-info-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    .course-info-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 表單輸入框 */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .form-control {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-sizing: border-box;
      font-size: 1rem;
      background-color: #fafafa;
      transition: all 0.25s ease;
    }

    .form-control:focus {
      outline: none;
      background-color: #fff;
      border-color: var(--primary-purple);
      box-shadow: 0 0 0 4px rgba(121, 40, 202, 0.15);
    }

    /* 送出按鈕：流光的華麗按鈕 */
    .submit-btn {
      width: 100%;
      background: var(--animated-gradient);
      background-size: 200% 200%;
      animation: gradientFlow 4s ease infinite;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(255, 0, 127, 0.32);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 10px;
    }

    .submit-btn:active:not(:disabled) {
      transform: scale(0.97);
      box-shadow: 0 4px 12px rgba(255, 0, 127, 0.2);
    }

    .submit-btn:disabled {
      background: #e0e0e0;
      animation: none;
      box-shadow: none;
      cursor: not-allowed;
      color: #a0a0a0;
    }

    .loading-text {
      text-align: center;
      color: var(--text-sub);
      padding: 30px 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>💃 文舞集 課程預約</h2>

    <div id="userWelcome" class="user-welcome">正在連結 LINE 帳號...</div>

    <form id="bookingForm">
      <span class="section-title">選擇欲預約的舞蹈課程：</span>
      
      <!-- 卡片渲染區 -->
      <div id="courseCardList" class="course-card-list">
        <div class="loading-text">✨ 課程載入中，請稍候...</div>
      </div>

      <div class="form-group">
        <label for="name">學員真實姓名</label>
        <input type="text" id="name" class="form-control" placeholder="請輸入姓名" required>
      </div>

      <div class="form-group">
        <label for="phone">聯絡電話</label>
        <input type="tel" id="phone" class="form-control" placeholder="0912345678" maxlength="10" required>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn" disabled>初始化中...</button>
    </form>
  </div>

  <script>
    // ⚠️ 請填入你的設定
    const MY_LIFF_ID = "2010788391-bIBpQ7sB"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxELTol0jvto-n2sBb7-e9QvGKMrLTW8gUC-CLB5Emb4nhq1NvqWk2fGIVQlAzQZDUdXw/exec";

    let lineProfile = { userId: "", displayName: "" };

    document.addEventListener("DOMContentLoaded", async () => {
      await initLIFF();
      await fetchCourses();
    });

    // 1. LIFF 初始化
    async function initLIFF() {
      const welcomeEl = document.getElementById("userWelcome");
      const submitBtn = document.getElementById("submitBtn");

      try {
        await liff.init({ liffId: MY_LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        lineProfile.userId = profile.userId;
        lineProfile.displayName = profile.displayName;

        welcomeEl.innerText = `👋 你好，${lineProfile.displayName}`;
        submitBtn.disabled = false;
        submitBtn.innerText = "確認送出預約";

      } catch (err) {
        console.error("LIFF 初始化失敗:", err);
        welcomeEl.innerText = "⚠️ 請在 LINE App 內開啟此頁面";
      }
    }

    // 2. 從 GAS 取得課程並動態渲染（帶有延遲彈跳登場效果）
    async function fetchCourses() {
      const container = document.getElementById("courseCardList");
      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();

        if (data.status === "success" && data.courses.length > 0) {
          container.innerHTML = ""; 

          data.courses.forEach((course, index) => {
            const isChecked = index === 0 ? "checked" : ""; 
            // 卡片延遲 0.1 秒依次彈跳登場
            const delay = (index * 0.1).toFixed(2);
            
            // 第一張卡片顯示 HOT 熱門標籤
            const hotTagHtml = index === 0 ? `
              <span class="hot-tag">
                <span class="pulse-dot"></span>HOT 熱門
              </span>
            ` : '';

            const cardHtml = `
              <div class="card-item-wrapper" style="animation-delay: ${delay}s;">
                <input 
                  type="radio" 
                  name="courseSelection" 
                  id="course_${index}" 
                  value="${course.courseName}" 
                  class="course-radio-input"
                  ${isChecked}
                >
                <label for="course_${index}" class="course-card">
                  <div class="card-check-icon"></div>
                  
                  <div class="course-header">
                    <span class="course-name">${course.courseName}</span>
                    ${hotTagHtml}
                  </div>

                  <div class="course-info-group">
                    <div class="course-info-item">
                      <span>👤 授課老師：${course.teacher}</span>
                    </div>
                    <div class="course-info-item">
                      <span>⏰ 上課時間：${course.timeInfo}</span>
                    </div>
                    <div class="course-info-item">
                      <span>👥 報名上限：${course.maxCapacity} 人</span>
                    </div>
                  </div>
                </label>
              </div>
            `;
            container.insertAdjacentHTML("beforeend", cardHtml);
          });
        } else {
          container.innerHTML = "<div class='loading-text'>目前暫無開放預約的課程。</div>";
        }
      } catch (err) {
        console.error(err);
        container.innerHTML = "<div class='loading-text' style='color:red;'>載入課程失敗，請重新整理。</div>";
      }
    }

    // 3. 表單送出到 GAS
    document.getElementById("bookingForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      if (!lineProfile.userId) {
        alert("無法讀取您的 LINE 身份，請確認已在 LINE 內開啟網頁！");
        return;
      }
      
      const selectedCourse = document.querySelector('input[name="courseSelection"]:checked');
      if (!selectedCourse) {
        alert("請選擇欲報名的課程！");
        return;
      }

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const submitBtn = document.getElementById("submitBtn");

      submitBtn.disabled = true;
      submitBtn.innerText = "正在為您預約中...";

      const payload = {
        userId: lineProfile.userId,
        displayName: lineProfile.displayName,
        name: name,
        phone: phone,
        item: selectedCourse.value
      };

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (result.status === "success") {
          alert(`🎉 報名成功！\n課程：${result.courseName}\n狀態：${result.bookingStatus}`);
          liff.closeWindow();
        } else if (result.status === "duplicate") {
          alert(`⚠️ ${result.message}`);
        } else {
          alert(`❌ 報名失敗：${result.message}`);
        }
      } catch (err) {
        alert("系統連線錯誤，請稍後再試！");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "確認送出預約";
      }
    });
  </script>
</body>
</html>
