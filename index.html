<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文舞集-課程預約</title>
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      padding: 20px;
      color: #1d1d1f;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h2 {
      text-align: center;
      color: #ff007f;
      margin-bottom: 20px;
      font-size: 22px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #424245;
    }

    /* 🎴 卡片式課程選擇器樣式 */
    .course-cards-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .course-card {
      border: 2px solid #e5e5ea;
      border-radius: 12px;
      padding: 14px 16px;
      background-color: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      position: relative;
    }
    .course-card:hover {
      border-color: #ff007f;
      background-color: #fff0f6;
    }
    .course-card.selected {
      border-color: #ff007f;
      background-color: #fff0f6;
      box-shadow: 0 2px 8px rgba(255, 0, 127, 0.15);
    }
    .course-card-title {
      font-size: 16px;
      font-weight: bold;
      color: #1d1d1f;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .course-card-title .checkmark {
      display: none;
      color: #ff007f;
      font-weight: bold;
      font-size: 18px;
    }
    .course-card.selected .checkmark {
      display: inline;
    }
    .course-card-meta {
      font-size: 13px;
      color: #6e6e73;
      line-height: 1.5;
    }

    /* 載入中骨架 Placeholder */
    .loading-placeholder {
      text-align: center;
      padding: 20px;
      color: #86868b;
      font-size: 14px;
      background: #fafafa;
      border-radius: 12px;
      border: 1px dashed #d2d2d7;
    }

    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #424245;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #ff007f;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #ff007f, #7928ca);
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(255, 0, 127, 0.3);
      transition: opacity 0.2s;
    }
    button:disabled {
      background: #cccccc;
      box-shadow: none;
      cursor: not-allowed;
    }
    #statusMsg {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>文舞集 課程預約</h2>
  
  <form id="bookingForm">
    <div class="form-group">
      <div class="section-title">請選擇預約課程</div>
      <div id="courseCardsList" class="course-cards-container">
        <div class="loading-placeholder">⚡ 課程載入中...</div>
      </div>
      <input type="hidden" id="selectedCourseName" required>
    </div>

    <div class="form-group">
      <label for="userName">真實姓名</label>
      <input type="text" id="userName" placeholder="請輸入姓名" required>
    </div>

    <div class="form-group">
      <label for="userPhone">聯絡電話</label>
      <input type="tel" id="userPhone" placeholder="例如：0912345678" required>
    </div>

    <button type="submit" id="submitBtn">確認預約</button>
  </form>

  <div id="statusMsg"></div>
</div>

<script>
  // ⚠️ 請填入您的 Apps Script Web App URL 與 LIFF ID
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxrUvTVSlsseFJmQLCh9i0mTobYAkqTOkfcf73WfxKaNIi0t-cJd0RzNWO7FJx44oMG9Q/exec";
  const MY_LIFF_ID = "2010788391-bIBpQ7sB";

  let liffProfile = null;
  let coursesDataList = [];

  document.addEventListener("DOMContentLoaded", function() {
    initLiff();
    loadCoursesFast(); // 啟動快取與漸進式載入
  });

  async function initLiff() {
    try {
      await liff.init({ liffId: MY_LIFF_ID });
      if (liff.isLoggedIn()) {
        liffProfile = await liff.getProfile();
      } else {
        liff.login();
      }
    } catch (err) {
      console.error("LIFF 初始化失敗：", err);
    }
  }

  /**
   * ⚡ 快取 + 背景非同步漸進載入（卡片版）
   */
  async function loadCoursesFast() {
    // 1. 優先從 LocalStorage 讀取快取（0 秒瞬間出現卡片）
    const cachedData = localStorage.getItem("cached_courses_full_cards");
    if (cachedData) {
      coursesDataList = JSON.parse(cachedData);
      renderCourseCards(coursesDataList);
    }

    // 2. 背景默默向 GAS 發送 API 請求最新課程
    try {
      const response = await fetch(GAS_WEB_APP_URL);
      const data = await response.json();

      if (data.status === "success" && data.courses) {
        coursesDataList = data.courses;
        // 更新快取
        localStorage.setItem("cached_courses_full_cards", JSON.stringify(coursesDataList));
        // 靜默更新前端卡片
        renderCourseCards(coursesDataList);
      }
    } catch (e) {
      console.warn("無法取得最新課程清單，維持快取顯示。");
    }
  }

  /**
   * 渲染卡片清單 UI
   */
  function renderCourseCards(courses) {
    const container = document.getElementById("courseCardsList");
    const selectedInput = document.getElementById("selectedCourseName");
    const currentSelected = selectedInput.value;

    if (!courses || courses.length === 0) {
      container.innerHTML = `<div class="loading-placeholder">目前暫無開放預約的課程</div>`;
      return;
    }

    let cardsHtml = "";
    courses.forEach(c => {
      const isSelected = (c.courseName === currentSelected);
      cardsHtml += `
        <div class="course-card ${isSelected ? 'selected' : ''}" onclick="selectCourseCard('${c.courseName}', this)">
          <div class="course-card-title">
            <span>📖 ${c.courseName}</span>
            <span class="checkmark">✓</span>
          </div>
          <div class="course-card-meta">
            👤 授課老師：<b>${c.teacher || "未定"}</b><br>
            ⏰ 上課時間：<b>${c.timeInfo || "依公告為主"}</b>
          </div>
        </div>
      `;
    });

    container.innerHTML = cardsHtml;
  }

  /**
   * 點擊選擇卡片
   */
  function selectCourseCard(courseName, element) {
    document.getElementById("selectedCourseName").value = courseName;
    
    // 清除其他卡片的選取狀態
    const cards = document.querySelectorAll(".course-card");
    cards.forEach(card => card.classList.remove("selected"));

    // 為當前卡片加上選取樣式
    element.classList.add("selected");
  }

  // 提交報名表單
  document.getElementById("bookingForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMsg");
    
    const selectedCourse = document.getElementById("selectedCourseName").value;
    const userName = document.getElementById("userName").value.trim();
    const userPhone = document.getElementById("userPhone").value.trim();

    if (!selectedCourse) {
      alert("請先點擊選擇您要預約的課程卡片！");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "提交預約中...";
    statusMsg.textContent = "";

    const payload = {
      userId: liffProfile ? liffProfile.userId : "GUEST_ID",
      displayName: liffProfile ? liffProfile.displayName : "訪客",
      name: userName,
      phone: userPhone,
      item: selectedCourse
    };

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status === "success") {
        statusMsg.style.color = "#00875a";
        statusMsg.innerHTML = `🎉 預約成功！<br>課程：<b>${result.courseName}</b>`;
        
        // 重設表單與選取狀態
        document.getElementById("bookingForm").reset();
        document.getElementById("selectedCourseName").value = "";
        const cards = document.querySelectorAll(".course-card");
        cards.forEach(card => card.classList.remove("selected"));

      } else if (result.status === "duplicate") {
        statusMsg.style.color = "#ff9500";
        statusMsg.textContent = result.message;
      } else {
        statusMsg.style.color = "#de350b";
        statusMsg.textContent = "預約失敗：" + (result.message || "請再試一次");
      }
    } catch (err) {
      statusMsg.style.color = "#de350b";
      statusMsg.textContent = "網路錯誤，請稍後再試。";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "確認預約";
    }
  });
</script>

</body>
</html>
