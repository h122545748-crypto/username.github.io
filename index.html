<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>舞蹈課程預約</title>
  <!-- 載入 LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; background: #f8f9fa; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    h2 { text-align: center; color: #333; margin-top: 0; }
    .loading { text-align: center; color: #888; padding: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #444; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; padding: 12px; background: #ff007f; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #ccc; }
  </style>
</head>
<body>

<div class="container">
  <h2>💃 課程預約系統</h2>

  <div id="loading" class="loading">⚡ 正在快速載入課程中...</div>

  <form id="bookingForm" style="display: none;">
    <div class="form-group">
      <label for="courseSelect">選擇課程</label>
      <select id="courseSelect" required>
        <!-- 動態繪製課程選項 -->
      </select>
    </div>

    <div class="form-group">
      <label for="userName">姓名</label>
      <input type="text" id="userName" placeholder="請輸入姓名" required>
    </div>

    <div class="form-group">
      <label for="userPhone">電話</label>
      <input type="tel" id="userPhone" placeholder="請輸入電話號碼" required>
    </div>

    <button type="submit" id="submitBtn">確認預約</button>
  </form>
</div>

<script>
  // ⚙️ 設定區：請填入您的 GAS 與 LIFF 資料
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzSeprRLPTPDOAKAG4c0ysXzaQ5HnYf6Sy3ONyeD7sgDcumJRrUxgtGhXXOBB779FX0yQ/exec";
  const LIFF_ID = "2010788391-bIBpQ7sB";

  let userProfile = null;

  // 🚀 關鍵加速 1：網頁載入瞬間「平行發起」課程抓取，不等 LIFF 初始化
  const fetchCoursesPromise = fetch(GAS_URL)
    .then(res => res.json())
    .catch(err => {
      console.error("抓取課程失敗:", err);
      return null;
    });

  // 初始化流程
  window.onload = async function() {
    try {
      // 1. 初始化 LIFF
      await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) {
        userProfile = await liff.getProfile();
      } else {
        liff.login();
        return;
      }

      // 2. 取得平行載入的課程資料
      const data = await fetchCoursesPromise;
      
      if (data && data.status === "success") {
        renderCourseOptions(data.courses);
        document.getElementById("loading").style.display = "none";
        document.getElementById("bookingForm").style.display = "block";
      } else {
        document.getElementById("loading").innerText = "❌ 載入課程失敗，請重新整理。";
      }

    } catch (err) {
      console.error("系統初始化失敗:", err);
      document.getElementById("loading").innerText = "❌ 系統初始化失敗。";
    }
  };

  /**
   * 🚀 關鍵加速 2：使用 DocumentFragment 進行單次 DOM 批量繪製
   */
  function renderCourseOptions(courses) {
    const select = document.getElementById("courseSelect");
    select.innerHTML = "";

    const fragment = document.createDocumentFragment();

    courses.forEach(course => {
      const option = document.createElement("option");
      option.value = course.courseName;
      option.textContent = `${course.courseName} (${course.teacher} / ${course.timeInfo})`;
      fragment.appendChild(option);
    });

    select.appendChild(fragment);
  }

  // 表單送出處理
  document.getElementById("bookingForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.innerText = "預約處理中...";

    const payload = {
      userId: userProfile ? userProfile.userId : "UNKNOWN",
      displayName: userProfile ? userProfile.displayName : "網頁學員",
      name: document.getElementById("userName").value.trim(),
      phone: document.getElementById("userPhone").value.trim(),
      item: document.getElementById("courseSelect").value
    };

    try {
      const response = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      if (result.status === "success") {
        alert(`🎉 預約成功！\n課程：${result.courseName}`);
        liff.closeWindow();
      } else if (result.status === "duplicate") {
        alert(result.message);
      } else {
        alert("❌ 預約失敗：" + result.message);
      }
    } catch (err) {
      alert("❌ 網路連線異常，請稍後再試。");
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "確認預約";
    }
  });
</script>

</body>
</html>
