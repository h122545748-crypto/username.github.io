<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>文舞集 目前課程</title>
  
  <!-- 引入 LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --animated-gradient: linear-gradient(90deg, #ff007f, #7928ca, #00d2ff, #ff007f);
      --primary-pink: #ff007f;
      --border-color: #e2e2e8;
      --text-main: #1d1d1f;
      --text-sub: #6e6e73;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #f2f3f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
      overflow: hidden; /* 防止整個頁面被彈性拉動 */
    }

    /* 滿版容器 */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      position: relative;
    }

    /* --- 上方 2/3 滾動區域 --- */
    .scrollable-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 18px 20px 18px;
      -webkit-overflow-scrolling: touch; /* 滑動順暢度優化 */
    }

    /* 標題動畫 */
    @keyframes titleGradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h2 {
      text-align: center;
      margin: 0 0 6px 0;
      font-size: 1.75rem;
      font-weight: 900;
      background: var(--animated-gradient);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleGradientFlow 3s ease infinite;
      letter-spacing: 1px;
    }

    .user-welcome {
      text-align: center;
      color: var(--text-sub);
      font-size: 0.88rem;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px dashed #e5e5ea;
    }

    .section-title {
      font-weight: 700;
      margin-bottom: 14px;
      font-size: 0.95rem;
      display: block;
      color: var(--text-main);
    }

    /* 隱藏原生 Radio */
    .course-radio-input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .course-card-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 10px;
    }

    /* 卡片登場動畫 */
    @keyframes springSlideUp {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.92);
      }
      60% {
        opacity: 1;
        transform: translateY(-6px) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card-item-wrapper {
      opacity: 0;
      animation: springSlideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* 4px 雙層卡片與流光 */
    .course-card {
      position: relative;
      background-color: #ffffff;
      border-radius: 18px;
      padding: 18px;
      cursor: pointer;
      border: 4px solid var(--border-color);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.28s ease, border-color 0.28s ease;
      display: block;
      overflow: hidden;
      z-index: 1;
    }

    .course-card:active {
      transform: scale(0.95) !important;
    }

    @keyframes rotateNeon {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .course-card::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 250%;
      height: 500%;
      background: conic-gradient(#ff007f, #7928ca, #00d2ff, #ff007f);
      transform: translate(-50%, -50%) rotate(0deg);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -2;
    }

    .course-card::after {
      content: "";
      position: absolute;
      inset: 4px;
      background: #ffffff;
      border-radius: 12px;
      z-index: -1;
    }

    .course-radio-input:checked + .course-card {
      border-color: transparent;
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 10px 24px rgba(255, 0, 127, 0.3);
    }

    .course-radio-input:checked + .course-card::before {
      opacity: 1;
      animation: rotateNeon 3s linear infinite;
    }

    .card-check-icon {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid #ccc;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      transition: all 0.3s ease;
      z-index: 2;
    }

    @keyframes popSpin {
      0% { transform: scale(0.2) rotate(-180deg); }
      70% { transform: scale(1.3) rotate(15deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .course-radio-input:checked + .course-card .card-check-icon {
      background: linear-gradient(135deg, #ff007f, #7928ca);
      border-color: transparent;
      animation: popSpin 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .course-radio-input:checked + .course-card .card-check-icon::after {
      content: "✓";
      font-weight: 900;
    }

    .course-header {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }

    .course-name {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--text-main);
      padding-right: 28px;
      line-height: 1.35;
    }

    .course-info-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.88rem;
      color: var(--text-sub);
    }

    .course-info-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .loading-text {
      text-align: center;
      color: var(--text-sub);
      padding: 30px 0;
      font-size: 0.95rem;
    }

    /* --- 下方 1/3 固定表單區 --- */
    .fixed-bottom-panel {
      background: #ffffff;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      padding: 16px 18px 20px 18px;
      box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.08);
      z-index: 100;
    }

    .bottom-form-layout {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }

    /* 左側縮小版流光送出按鈕 */
    .submit-btn-square {
      width: 105px;
      flex-shrink: 0;
      background: var(--animated-gradient);
      background-size: 200% 200%;
      animation: titleGradientFlow 3s ease infinite;
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 0.98rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255, 0, 127, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.35;
      padding: 8px;
      text-align: center;
    }

    .submit-btn-square:active:not(:disabled) {
      transform: scale(0.94);
      box-shadow: 0 2px 8px rgba(255, 0, 127, 0.2);
    }

    .submit-btn-square:disabled {
      background: #e0e0e0;
      animation: none;
      box-shadow: none;
      cursor: not-allowed;
      color: #a0a0a0;
    }

    /* 右側輸入框容器 */
    .input-fields-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-control-compact {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.92rem;
      background-color: #fafafa;
      transition: all 0.25s ease;
      outline: none;
    }

    .form-control-compact:focus {
      background-color: #fff;
      border-color: var(--primary-pink);
      box-shadow: 0 0 0 3px rgba(255, 0, 127, 0.15);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <form id="bookingForm" style="display: flex; flex-direction: column; height: 100%;">
      
      <!-- 上方 2/3 可滾動區 -->
      <div class="scrollable-content">
        <h2>文舞集 目前課程</h2>
        <div id="userWelcome" class="user-welcome">正在連結 LINE 帳號...</div>

        <span class="section-title">選擇欲預約的舞蹈課程：</span>
        
        <!-- 卡片渲染區 -->
        <div id="courseCardList" class="course-card-list">
          <div class="loading-text">✨ 課程載入中，請稍候...</div>
        </div>
      </div>

      <!-- 下方 1/3 固定表單區 -->
      <div class="fixed-bottom-panel">
        <div class="bottom-form-layout">
          
          <!-- 左側：縮小版確認按鈕 -->
          <button type="submit" class="submit-btn-square" id="submitBtn" disabled>
            確認<br>預約
          </button>

          <!-- 右側：姓名與電話輸入框 -->
          <div class="input-fields-group">
            <input 
              type="text" 
              id="name" 
              class="form-control-compact" 
              placeholder="請輸入姓名" 
              required
            >
            <input 
              type="tel" 
              id="phone" 
              class="form-control-compact" 
              placeholder="0912345678" 
              maxlength="10" 
              required
            >
          </div>

        </div>
      </div>

    </form>
  </div>

  <script>
    // ⚠️ 請填入你的設定
    const MY_LIFF_ID = "2010788391-bIBpQ7sB"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxELTol0jvto-n2sBb7-e9QvGKMrLTW8gUC-CLB5Emb4nhq1NvqWk2fGIVQlAzQZDUdXw/exec";

    let lineProfile = { userId: "", displayName: "" };

    document.addEventListener("DOMContentLoaded", async () => {
      await initLIFF();
      await fetchCourses();
    });

    // 1. LIFF 初始化
    async function initLIFF() {
      const welcomeEl = document.getElementById("userWelcome");
      const submitBtn = document.getElementById("submitBtn");

      try {
        await liff.init({ liffId: MY_LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        lineProfile.userId = profile.userId;
        lineProfile.displayName = profile.displayName;

        welcomeEl.innerText = `👋 你好，${lineProfile.displayName}`;
        submitBtn.disabled = false;
        submitBtn.innerHTML = "確認<br>預約";

      } catch (err) {
        console.error("LIFF 初始化失敗:", err);
        welcomeEl.innerText = "⚠️ 請在 LINE App 內開啟此頁面";
      }
    }

    // 2. 從 GAS 取得課程並動態渲染
    async function fetchCourses() {
      const container = document.getElementById("courseCardList");
      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();

        if (data.status === "success" && data.courses.length > 0) {
          container.innerHTML = ""; 

          data.courses.forEach((course, index) => {
            const isChecked = index === 0 ? "checked" : ""; 
            const delay = (index * 0.1).toFixed(2);

            // 遇到括號自動換行
            const formattedCourseName = course.courseName
              .replace(/[\(（]/g, '<br>(');

            const cardHtml = `
              <div class="card-item-wrapper" style="animation-delay: ${delay}s;">
                <input 
                  type="radio" 
                  name="courseSelection" 
                  id="course_${index}" 
                  value="${course.courseName}" 
                  class="course-radio-input"
                  ${isChecked}
                >
                <label for="course_${index}" class="course-card">
                  <div class="card-check-icon"></div>
                  
                  <div class="course-header">
                    <span class="course-name">${formattedCourseName}</span>
                  </div>

                  <div class="course-info-group">
                    <div class="course-info-item">
                      <span>👤 授課老師：${course.teacher}</span>
                    </div>
                    <div class="course-info-item">
                      <span>⏰ 上課時間：${course.timeInfo}</span>
                    </div>
                    <div class="course-info-item">
                      <span>👥 報名上限：${course.maxCapacity} 人</span>
                    </div>
                  </div>
                </label>
              </div>
            `;
            container.insertAdjacentHTML("beforeend", cardHtml);
          });
        } else {
          container.innerHTML = "<div class='loading-text'>目前暫無開放預約的課程。</div>";
        }
      } catch (err) {
        console.error(err);
        container.innerHTML = "<div class='loading-text' style='color:red;'>載入課程失敗，請重新整理。</div>";
      }
    }

    // 3. 表單送出到 GAS
    document.getElementById("bookingForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      if (!lineProfile.userId) {
        alert("無法讀取您的 LINE 身份，請確認已在 LINE 內開啟網頁！");
        return;
      }
      
      const selectedCourse = document.querySelector('input[name="courseSelection"]:checked');
      if (!selectedCourse) {
        alert("請選擇欲報名的課程！");
        return;
      }

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const submitBtn = document.getElementById("submitBtn");

      submitBtn.disabled = true;
      submitBtn.innerText = "處理中";

      const payload = {
        userId: lineProfile.userId,
        displayName: lineProfile.displayName,
        name: name,
        phone: phone,
        item: selectedCourse.value
      };

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (result.status === "success") {
          alert(`🎉 報名成功！\n課程：${result.courseName}\n狀態：${result.bookingStatus}`);
          liff.closeWindow();
        } else if (result.status === "duplicate") {
          alert(`⚠️ ${result.message}`);
        } else {
          alert(`❌ 報名失敗：${result.message}`);
        }
      } catch (err) {
        alert("系統連線錯誤，請稍後再試！");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = "確認<br>預約";
      }
    });
  </script>
</body>
</html>
