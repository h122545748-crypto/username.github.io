<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課程預約</title>
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      padding: 20px;
      color: #1d1d1f;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h2 {
      text-align: center;
      color: #ff007f;
      margin-bottom: 20px;
      font-size: 22px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #424245;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #ff007f;
    }
    .course-detail-box {
      background-color: #fff0f6;
      border: 1px solid #ffccd5;
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
      font-size: 13px;
      color: #d6006e;
      display: none;
      line-height: 1.5;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #ff007f, #7928ca);
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(255, 0, 127, 0.3);
      transition: opacity 0.2s;
    }
    button:disabled {
      background: #cccccc;
      box-shadow: none;
      cursor: not-allowed;
    }
    #statusMsg {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>課程預約</h2>
  
  <form id="bookingForm">
    <div class="form-group">
      <label for="courseSelect">選擇課程</label>
      <select id="courseSelect" required onchange="updateCourseDetail()">
        <option value="">載入中...</option>
      </select>
      <div id="courseDetail" class="course-detail-box"></div>
    </div>

    <div class="form-group">
      <label for="userName">真實姓名</label>
      <input type="text" id="userName" placeholder="請輸入姓名" required>
    </div>

    <div class="form-group">
      <label for="userPhone">聯絡電話</label>
      <input type="tel" id="userPhone" placeholder="例如：0912345678" required>
    </div>

    <button type="submit" id="submitBtn">確認預約</button>
  </form>

  <div id="statusMsg"></div>
</div>

<script>
  // ⚠️ 請填入您的 Apps Script Web App URL 與 LIFF ID
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxrUvTVSlsseFJmQLCh9i0mTobYAkqTOkfcf73WfxKaNIi0t-cJd0RzNWO7FJx44oMG9Q/exec";
  const MY_LIFF_ID = "2010788391-bIBpQ7sB";

  let liffProfile = null;
  let fullCourseMap = {}; // 存放詳細課程資料 (老師, 時間)

  document.addEventListener("DOMContentLoaded", function() {
    initLiff();
    loadCoursesFast(); // 啟動漸進式快取載入
  });

  async function initLiff() {
    try {
      await liff.init({ liffId: MY_LIFF_ID });
      if (liff.isLoggedIn()) {
        liffProfile = await liff.getProfile();
      } else {
        liff.login();
      }
    } catch (err) {
      console.error("LIFF 初始化失敗：", err);
    }
  }

  /**
   * ⚡ 快取 + 雙階段非同步載入機制
   */
  async function loadCoursesFast() {
    const select = document.getElementById("courseSelect");

    // 0. 優先讀取 LocalStorage 快取（0 秒瞬間呈現）
    const cachedNames = localStorage.getItem("cached_course_names");
    const cachedDetails = localStorage.getItem("cached_course_details");

    if (cachedDetails) {
      fullCourseMap = JSON.parse(cachedDetails);
    }

    if (cachedNames) {
      renderSelectOptions(JSON.parse(cachedNames));
    }

    // 1. 第一階段：背景極速抓取課程名稱清單
    try {
      const resNames = await fetch(`${GAS_WEB_APP_URL}?action=getCourseNames`);
      const dataNames = await resNames.json();

      if (dataNames.status === "success" && dataNames.courseNames.length > 0) {
        renderSelectOptions(dataNames.courseNames);
        localStorage.setItem("cached_course_names", JSON.stringify(dataNames.courseNames));
      }
    } catch (e) {
      console.warn("無法取得最新課程名稱列表，使用快取或備用機制。");
    }

    // 2. 第二階段：背景靜默補充詳細資料 (老師、時間)
    try {
      const resDetails = await fetch(`${GAS_WEB_APP_URL}`);
      const dataDetails = await resDetails.json();

      if (dataDetails.status === "success") {
        fullCourseMap = {};
        dataDetails.courses.forEach(c => {
          fullCourseMap[c.courseName] = c;
        });
        localStorage.setItem("cached_course_details", JSON.stringify(fullCourseMap));
        updateCourseDetail(); // 若使用者已選擇，及時刷新細節
      }
    } catch (e) {
      console.warn("詳細課程資料載入失敗。");
    }
  }

  function renderSelectOptions(names) {
    const select = document.getElementById("courseSelect");
    const currentVal = select.value;
    select.innerHTML = '<option value="">-- 請選擇舞蹈課程 --</option>';

    names.forEach(name => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);
    });

    if (currentVal) {
      select.value = currentVal;
    }
    updateCourseDetail();
  }

  function updateCourseDetail() {
    const selected = document.getElementById("courseSelect").value;
    const detailBox = document.getElementById("courseDetail");

    if (selected && fullCourseMap[selected]) {
      const item = fullCourseMap[selected];
      detailBox.innerHTML = `
        👤 授課老師：<b>${item.teacher || "未定"}</b><br>
        ⏰ 上課時間：<b>${item.timeInfo || "依公告為主"}</b>
      `;
      detailBox.style.display = "block";
    } else {
      detailBox.style.display = "none";
    }
  }

  // 提交報名表單
  document.getElementById("bookingForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMsg");
    
    const selectedCourse = document.getElementById("courseSelect").value;
    const userName = document.getElementById("userName").value.trim();
    const userPhone = document.getElementById("userPhone").value.trim();

    if (!selectedCourse) {
      alert("請選擇課程！");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "提交預約中...";
    statusMsg.textContent = "";

    const payload = {
      userId: liffProfile ? liffProfile.userId : "GUEST_ID",
      displayName: liffProfile ? liffProfile.displayName : "訪客",
      name: userName,
      phone: userPhone,
      item: selectedCourse
    };

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status === "success") {
        statusMsg.style.color = "#00875a";
        statusMsg.innerHTML = `🎉 預約成功！<br>課程：<b>${result.courseName}</b>`;
        document.getElementById("bookingForm").reset();
        document.getElementById("courseDetail").style.display = "none";
      } else if (result.status === "duplicate") {
        statusMsg.style.color = "#ff9500";
        statusMsg.textContent = result.message;
      } else {
        statusMsg.style.color = "#de350b";
        statusMsg.textContent = "預約失敗：" + (result.message || "請再試一次");
      }
    } catch (err) {
      statusMsg.style.color = "#de350b";
      statusMsg.textContent = "網路錯誤，請稍後再試。";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "確認預約";
    }
  });
</script>

</body>
</html>
