<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>舞蹈課程報名</title>
  
  <!-- 引入 LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --primary-color: #e91e63; /* 品牌亮粉色 */
      --primary-light: #fce4ec;
      --border-color: #e0e0e0;
      --text-main: #333333;
      --text-sub: #666666;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 20px 15px;
      color: var(--text-main);
    }

    .form-container {
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--primary-color);
      font-size: 1.4rem;
    }

    .user-welcome {
      text-align: center;
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--border-color);
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 1rem;
      display: block;
    }

    /* 隱藏原生 Radio 按鈕 */
    .course-radio-input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    /* 卡片容器 */
    .course-card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    /* 卡片樣式 */
    .course-card {
      position: relative;
      background-color: #ffffff;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      display: block;
    }

    .course-card:active {
      transform: scale(0.98);
    }

    /* 選中狀態卡片風格 */
    .course-radio-input:checked + .course-card {
      border-color: var(--primary-color);
      background-color: var(--primary-light);
      box-shadow: 0 4px 12px rgba(233, 30, 99, 0.15);
    }

    /* 選中時的勾勾圖示 */
    .card-check-icon {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #fff;
      transition: all 0.2s ease;
    }

    .course-radio-input:checked + .course-card .card-check-icon {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }

    .course-radio-input:checked + .course-card .card-check-icon::after {
      content: "✓";
      font-weight: bold;
    }

    /* 課程卡片內文排版 */
    .course-name {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-main);
      margin-bottom: 8px;
      padding-right: 28px; /* 避開右上角勾勾 */
      line-height: 1.4;
    }

    .course-info-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.88rem;
      color: var(--text-sub);
    }

    .course-info-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 表單輸入框樣式 */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    .submit-btn {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .loading-text {
      text-align: center;
      color: var(--text-sub);
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>💃 課程線上預約</h2>

    <!-- 顯示使用者 LINE 暱稱 -->
    <div id="userWelcome" class="user-welcome">正在登入 LINE 帳號...</div>

    <form id="bookingForm">
      <span class="section-title">請選擇預約課程：</span>
      
      <!-- 動態載入卡片的容器 -->
      <div id="courseCardList" class="course-card-list">
        <div class="loading-text">課程載入中，請稍候...</div>
      </div>

      <div class="form-group">
        <label for="name">您的真實姓名：</label>
        <input type="text" id="name" class="form-control" placeholder="請輸入姓名" required>
      </div>

      <div class="form-group">
        <label for="phone">聯絡電話 (09開頭)：</label>
        <input type="tel" id="phone" class="form-control" placeholder="0912345678" maxlength="10" required>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn" disabled>初始化中...</button>
    </form>
  </div>

  <script>
    // ⚠️ 請填入你的設定
    const MY_LIFF_ID = "2010788391-bIBpQ7sB"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxELTol0jvto-n2sBb7-e9QvGKMrLTW8gUC-CLB5Emb4nhq1NvqWk2fGIVQlAzQZDUdXw/exec";

    let lineProfile = {
      userId: "",
      displayName: ""
    };

    // 頁面初始化
    document.addEventListener("DOMContentLoaded", async () => {
      await initLIFF();
      await fetchCourses();
    });

    // 1. LIFF 初始化與取得 User Profile
    async function initLIFF() {
      const welcomeEl = document.getElementById("userWelcome");
      const submitBtn = document.getElementById("submitBtn");

      try {
        await liff.init({ liffId: MY_LIFF_ID });

        if (!liff.isLoggedIn()) {
          // 若未登入 LINE，引導登入
          liff.login();
          return;
        }

        // 取得使用者 LINE Profile
        const profile = await liff.getProfile();
        lineProfile.userId = profile.userId;
        lineProfile.displayName = profile.displayName;

        welcomeEl.innerText = `👋 你好，${lineProfile.displayName}`;
        submitBtn.disabled = false;
        submitBtn.innerText = "確認送出報名";

      } catch (err) {
        console.error("LIFF 初始化失敗:", err);
        welcomeEl.innerText = "⚠️ 請在 LINE App 內開啟此頁面";
      }
    }

    // 2. 從 GAS 取得課程清單並渲染卡片
    async function fetchCourses() {
      const container = document.getElementById("courseCardList");
      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();

        if (data.status === "success" && data.courses.length > 0) {
          container.innerHTML = ""; // 清空載入中

          data.courses.forEach((course, index) => {
            const isChecked = index === 0 ? "checked" : ""; // 預設選第一個
            const cardHtml = `
              <div>
                <input 
                  type="radio" 
                  name="courseSelection" 
                  id="course_${index}" 
                  value="${course.courseName}" 
                  class="course-radio-input"
                  ${isChecked}
                >
                <label for="course_${index}" class="course-card">
                  <div class="card-check-icon"></div>
                  <div class="course-name">${course.courseName}</div>
                  <div class="course-info-group">
                    <div class="course-info-item">
                      <span>👤 授課老師：${course.teacher}</span>
                    </div>
                    <div class="course-info-item">
                      <span>⏰ 上課時間：${course.timeInfo}</span>
                    </div>
                    <div class="course-info-item">
                      <span>👥 人數上限：${course.maxCapacity} 人</span>
                    </div>
                  </div>
                </label>
              </div>
            `;
            container.insertAdjacentHTML("beforeend", cardHtml);
          });
        } else {
          container.innerHTML = "<div class='loading-text'>目前暫無開放預約的課程。</div>";
        }
      } catch (err) {
        console.error(err);
        container.innerHTML = "<div class='loading-text' style='color:red;'>載入課程失敗，請重新整理。</div>";
      }
    }

    // 3. 送出表單資料到 GAS
    document.getElementById("bookingForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      if (!lineProfile.userId) {
        alert("無法讀取您的 LINE 身份，請確認已在 LINE 內開啟網頁！");
        return;
      }
      
      const selectedCourse = document.querySelector('input[name="courseSelection"]:checked');
      if (!selectedCourse) {
        alert("請選擇欲報名的課程！");
        return;
      }

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const submitBtn = document.getElementById("submitBtn");

      submitBtn.disabled = true;
      submitBtn.innerText = "資料送出中...";

      const payload = {
        userId: lineProfile.userId,          // 自動帶入真實 LINE User ID
        displayName: lineProfile.displayName, // 自動帶入 LINE 暱稱
        name: name,                          // 使用者填寫的真實姓名
        phone: phone,                        // 使用者填寫的電話
        item: selectedCourse.value          // 選中的課程名稱
      };

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (result.status === "success") {
          alert(`🎉 報名成功！\n課程：${result.courseName}\n狀態：${result.bookingStatus}`);
          liff.closeWindow(); // 報名成功後自動關閉 LIFF 視窗
        } else if (result.status === "duplicate") {
          alert(`⚠️ ${result.message}`);
        } else {
          alert(`❌ 報名失敗：${result.message}`);
        }
      } catch (err) {
        alert("系統連線錯誤，請稍後再試！");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "確認送出報名";
      }
    });
  </script>
</body>
</html>
