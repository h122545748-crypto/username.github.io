<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文舞集｜線上預約系統</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --primary-color: #ff007f;
      --secondary-color: #7928ca;
      --bg-color: #f5f5f7;
      --card-bg: #ffffff;
      --text-color: #1d1d1f;
      --gray-text: #86868b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      color: var(--text-color);
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 22px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary-color);
    }

    /* 🎴 卡片式選單樣式 */
    .course-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .course-card {
      position: relative;
      background: #fafafa;
      border: 2px solid #e5e5ea;
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .course-card:hover {
      border-color: #bbb;
    }

    /* 高亮邊框與選取狀態 */
    .course-card.selected {
      border-color: var(--primary-color);
      background-color: #fff0f6;
    }

    /* 選取標記 Checkmark (✓) */
    .course-card .checkmark {
      display: none;
      position: absolute;
      top: 12px;
      right: 14px;
      width: 22px;
      height: 22px;
      background-color: var(--primary-color);
      color: white;
      border-radius: 50%;
      text-align: center;
      line-height: 22px;
      font-size: 13px;
      font-weight: bold;
    }

    .course-card.selected .checkmark {
      display: block;
    }

    .course-title {
      font-weight: bold;
      font-size: 16px;
      color: var(--text-color);
      margin-bottom: 4px;
      padding-right: 28px;
    }

    .course-info {
      font-size: 13px;
      color: var(--gray-text);
      line-height: 1.4;
    }

    /* 🔘 送出按鈕與 Loading 效果 */
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Spinner 旋轉動畫 */
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      display: none;
      text-align: center;
      color: var(--gray-text);
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>文舞集｜線上預約</h2>

  <form id="bookingForm">
    <div class="form-group">
      <label for="name">姓名</label>
      <input type="text" id="name" placeholder="請輸入姓名" required>
    </div>

    <div class="form-group">
      <label for="phone">電話</label>
      <input type="tel" id="phone" placeholder="請輸入聯絡電話" required>
    </div>

    <div class="form-group">
      <label>選擇預約課程</label>
      <div id="courseContainer" class="course-list">
        <div style="text-align:center; color: var(--gray-text); padding: 20px;">課程選單載入中...</div>
      </div>
    </div>

    <button type="submit" id="submitBtn" class="submit-btn" disabled>
      <div class="spinner" id="btnSpinner"></div>
      <span id="btnText">請選擇課程</span>
    </button>
    <div class="loading-text" id="loadingHint">預約資料處理中，請勿關閉視窗...</div>
  </form>
</div>

<script>
  // ⚠️ 請填入您的 GAS Web App 網址與 LIFF ID
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyokOsywfQ8V0UeY6PFruHptWyS34TiZ1pkxhUNxw5XcidhWZ6RGARx2BgPh1N4SmDbJg/exec";
  const LIFF_ID = "2010788391-bIBpQ7sB";

  let selectedCourseName = "";
  let userProfile = { userId: "", displayName: "" };

  // 初始化 LIFF
  async function initLIFF() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        userProfile.userId = profile.userId;
        userProfile.displayName = profile.displayName;
      } else {
        liff.login();
      }
    } catch (err) {
      console.error("LIFF 初始化失敗:", err);
    }
  }

  // ⚡ 讀取課程（優先讀取 LocalStorage 快取達到秒開效果）
  async function loadCourses() {
    const cachedData = localStorage.getItem("wenwu_courses");
    if (cachedData) {
      renderCourseCards(JSON.parse(cachedData));
    }

    try {
      const response = await fetch(GAS_URL);
      const result = await response.json();

      if (result.status === "success" && result.courses) {
        // 只保留「上架」的課程
        const activeCourses = result.courses.filter(c => c.status === "上架");
        
        // 更新快取並重新渲染
        localStorage.setItem("wenwu_courses", JSON.stringify(activeCourses));
        renderCourseCards(activeCourses);
      }
    } catch (error) {
      console.error("無法更新最新課程資訊:", error);
    }
  }

  // 🎴 渲染卡片式選單
  function renderCourseCards(courses) {
    const container = document.getElementById("courseContainer");
    if (!courses || courses.length === 0) {
      container.innerHTML = `<div style="text-align:center; color:#86868b; padding:20px;">目前尚無可預約的課程</div>`;
      return;
    }

    container.innerHTML = "";
    courses.forEach(c => {
      const card = document.createElement("div");
      card.className = "course-card";
      if (c.courseName === selectedCourseName) {
        card.classList.add("selected");
      }

      card.innerHTML = `
        <div class="checkmark">✓</div>
        <div class="course-title">${c.courseName}</div>
        <div class="course-info">👤 授課老師：${c.teacher}<br>⏰ 上課時間：${c.timeInfo}</div>
      `;

      card.addEventListener("click", () => {
        document.querySelectorAll(".course-card").forEach(el => el.classList.remove("selected"));
        card.classList.add("selected");
        selectedCourseName = c.courseName;

        const btn = document.getElementById("submitBtn");
        btn.disabled = false;
        document.getElementById("btnText").innerText = `確認預約《${c.courseName}》`;
      });

      container.appendChild(card);
    });
  }

  // 🚀 處理提交與「處理中」動畫效果
  document.getElementById("bookingForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!selectedCourseName) {
      alert("請先選擇要預約的課程！");
      return;
    }

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();

    if (!name || !phone) {
      alert("請填寫姓名與電話！");
      return;
    }

    // 切換為「處理中」狀態效果
    setLoadingState(true);

    const payload = {
      userId: userProfile.userId || "WEB_TEST_USER",
      displayName: userProfile.displayName || name,
      name: name,
      phone: phone,
      item: selectedCourseName
    };

    try {
      const response = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });

      const resData = await response.json();

      if (resData.status === "success") {
        alert(`🎉 預約成功！\n您已成功報名【${resData.courseName}】。`);
        location.reload();
      } else if (resData.status === "duplicate") {
        alert(resData.message);
      } else {
        alert("預約失敗：" + (resData.message || "請稍後再試"));
      }
    } catch (err) {
      alert("網路連線異常，請重新嘗試。");
      console.error(err);
    } finally {
      setLoadingState(false);
    }
  });

  // 切換按鈕與載入提示狀態
  function setLoadingState(isLoading) {
    const btn = document.getElementById("submitBtn");
    const spinner = document.getElementById("btnSpinner");
    const btnText = document.getElementById("btnText");
    const loadingHint = document.getElementById("loadingHint");

    if (isLoading) {
      btn.disabled = true;
      spinner.style.display = "block";
      btnText.innerText = "資料處理中...";
      loadingHint.style.display = "block";
    } else {
      btn.disabled = false;
      spinner.style.display = "none";
      btnText.innerText = `確認預約《${selectedCourseName}》`;
      loadingHint.style.display = "none";
    }
  }

  // 頁面初始化
  initLIFF();
  loadCourses();
</script>

</body>
</html>
